version: "3.9"

# Mnemo — Self-host in one command
# docker-compose up → Dashboard at localhost:3000, API at localhost:8000

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MNEMO_DEBUG=false
    depends_on:
      - supabase-db
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  supabase-db:
    image: supabase/postgres:15.1.0.117
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnemo-dev-password}
      POSTGRES_DB: mnemo
    volumes:
      - supabase-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-mnemo-dev-password}@supabase-db:5432/mnemo
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-mnemo-dev-secret}
      NEXTAUTH_URL: http://localhost:3001
    depends_on:
      - supabase-db
    restart: unless-stopped

volumes:
  supabase-data:
