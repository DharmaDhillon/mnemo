[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemo-sdk"
version = "0.1.0"
description = "Memory and observability for AI agents. Two lines of code to give any agent persistent memory and full trace visibility."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mnemo Contributors" },
]
keywords = ["ai", "agents", "memory", "observability", "llm", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.0"]
langfuse = ["langfuse>=2.0.0"]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
all = [
    "mnemo[mem0,langfuse,otel,anthropic,openai]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/mnemo-ai/mnemo"
Documentation = "https://docs.mnemo.ai"
Repository = "https://github.com/mnemo-ai/mnemo"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
